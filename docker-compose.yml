services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carteira
    command: >
      postgres
      -c max_connections=250
      -c shared_buffers=128MB
      -c synchronous_commit=on
      -c fsync=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d carteira"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  api:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/carteira
      JWT_SECRET: segredo-super-resiliente-projeto-transferencias-2026
      DB_POOL_MAX: 80
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/auditoria || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s

volumes:
  pgdata:
